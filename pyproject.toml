[project]
name = "healthmap"
version = "0.2.0"
description = "Agricultural health monitoring with crop detection ML models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eo-learn[extra,visualisation,visualization]>=1.5.7",
    "fastapi[all]>=0.118.0",
    "iprogress>=0.4",
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.6",
    "sentinelhub>=3.11.2",
    "shapely>=2.1.2",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "python-jose>=3.5.0",
    "bcrypt>=5.0.0",
]
